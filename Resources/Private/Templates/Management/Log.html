<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h2><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.heading" /></h2>
    <p><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.description" /></p>

    <f:if condition="{logs -> f:count()}">
        <f:then>
            <div class="mb-3">
                <a class="btn btn-danger btn-sm t3js-modal-trigger"
                   href="{f:be.uri(route: 'redirect_disable_log_delete', parameters: '{deleteAll: 1}')}"
                   data-severity="warning"
                   data-title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.deleteAll.confirmTitle')}"
                   data-bs-content="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.deleteAll.confirmContent')}"
                   data-button-close-text="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:common.cancel')}">
                    <core:icon identifier="actions-delete" /> <f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.deleteAll.button" />
                </a>
            </div>

            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.table.date" /></th>
                            <th><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.table.sourceHost" /></th>
                            <th><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.table.sourcePath" /></th>
                            <th><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.table.target" /></th>
                            <th><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.table.redirectCount" /></th>
                            <th><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.table.reason" /></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{logs}" as="log">
                            <tr>
                                <td><f:format.date format="d.m.Y H:i:s">@{log.crdate}</f:format.date></td>
                                <td>{log.source_host}</td>
                                <td>{log.source_path -> f:format.crop(maxCharacters: 100)}</td>
                                <td>{log.target -> f:format.crop(maxCharacters: 100)}</td>
                                <td>{log.status_code}</td>
                                <td>{log.reason}</td>
                                <td class="text-nowrap">
                                    <a class="btn btn-default btn-sm"
                                       href="{f:be.uri(route: 'redirect_recheck', parameters: '{redirectUid: log.redirect_uid}')}"
                                       title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.recheck.title')}">
                                        <core:icon identifier="actions-refresh" /> <f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.recheck.button" />
                                    </a>
                                    <a class="btn btn-default btn-sm t3js-modal-trigger"
                                       href="{f:be.uri(route: 'redirect_disable_log_delete', parameters: '{logUid: log.uid}')}"
                                       title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.delete.title')}"
                                       data-severity="warning"
                                       data-title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.delete.confirmTitle')}"
                                       data-bs-content="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.delete.confirmContent')}"
                                       data-button-close-text="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:common.cancel')}">
                                        <core:icon identifier="actions-delete" />
                                    </a>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>

            <f:if condition="{pagination.numberOfPages} > 1">
                <nav class="pagination-wrap">
                    <ul class="pagination">
                        <f:if condition="{pagination.hasLessPages}">
                            <f:then>
                                <li class="page-item">
                                    <a class="page-link" href="{f:be.uri(route: 'redirect_disable_log', parameters: '{page: 1}')}" title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:pagination.firstPage')}"><core:icon identifier="actions-view-paging-first" /></a>
                                </li>
                                <li class="page-item">
                                    <a class="page-link" href="{f:be.uri(route: 'redirect_disable_log', parameters: '{page: pagination.previousPage}')}" title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:pagination.previousPage')}"><core:icon identifier="actions-view-paging-previous" /></a>
                                </li>
                            </f:then>
                            <f:else>
                                <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                                <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                            </f:else>
                        </f:if>
                        <li class="page-item disabled">
                            <span class="page-link"><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.pagination.range" arguments="{0: pagination.startRecord, 1: pagination.endRecord, 2: pagination.count}" /></span>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link"><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.pagination.page" arguments="{0: pagination.current, 1: pagination.numberOfPages}" /></span>
                        </li>
                        <f:if condition="{pagination.hasMorePages}">
                            <f:then>
                                <li class="page-item">
                                    <a class="page-link" href="{f:be.uri(route: 'redirect_disable_log', parameters: '{page: pagination.nextPage}')}" title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:pagination.nextPage')}"><core:icon identifier="actions-view-paging-next" /></a>
                                </li>
                                <li class="page-item">
                                    <a class="page-link" href="{f:be.uri(route: 'redirect_disable_log', parameters: '{page: pagination.numberOfPages}')}" title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:pagination.lastPage')}"><core:icon identifier="actions-view-paging-last" /></a>
                                </li>
                            </f:then>
                            <f:else>
                                <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                                <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                            </f:else>
                        </f:if>
                    </ul>
                </nav>
            </f:if>
        </f:then>
        <f:else>
            <f:be.infobox state="0" title="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.empty.title')}">
                <p><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:log.empty.message" /></p>
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>
</html>
