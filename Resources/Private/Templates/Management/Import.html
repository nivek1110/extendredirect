<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:rd="http://typo3.org/ns/TYPO3/CMS/Redirects/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <f:be.pageRenderer
            includeJavaScriptModules="{
            0: '@typo3/backend/modal.js',
            1: '@typo3/backend/multi-record-selection.js',
            2: '@typo3/backend/multi-record-selection-edit-action.js',
            3: '@typo3/backend/multi-record-selection-delete-action.js',
            4: '@typo3/redirects/redirects-module.js',
        }"
    />
    <h3><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.format.title" /><br/> <f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.format.subtitle" /></h3>
    <a target="_blank" class="btn btn-default btn-sm" href="{f:uri.resource(path: 'EXT:extendredirect/Resources/Public/redirect.csv')}"><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.downloadExample" /></a>
    <hr class="double" />
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>source_host</th>
                <th>source_path</th>
                <th>target</th>
                <th>target_statuscode</th>
                <th>respect_query_parameters</th>
                <th>keep_query_parameters</th>
                <th>force_https</th>
                <th>is_regexp</th>
                <th>disabled</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>*</td>
                <td>/source_example</td>
                <td>/target_example</td>
                <td>307</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
    <p><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.format.optionalColumns" /></p>

    <form action="{f:be.uri(route: 'redirect_import')}" method="post" enctype="multipart/form-data">
        <h2><f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.heading" /></h2>
        <f:form.upload name="redirect" /><br /><br />
        <f:form.submit value="{f:translate(key: 'LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.submit')}" />
    </form>
    <f:comment>
    <f:form action="import" enctype="multipart/form-data" name="redirectImport" object="{redirectImport}">
        <h2>Import Redirects</h2>
        <f:form.upload name="redirect" /><br /><br />
        <f:form.submit value="Import file" />
    </f:form>
    </f:comment>
    <f:if condition="{imported} || {ignoreCounter}">
        <hr class="double" />
        <div>
            <h4><b>{imported}</b> <f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.result.imported" arguments="{0: counter}" /></h4>
            <h4><b>{ignoreCounter}</b> <f:translate key="LLL:EXT:extendredirect/Resources/Private/Language/locallang.xlf:import.result.skipped" arguments="{0: counter}" /></h4>
        </div>
    </f:if>
</f:section>
</html>
