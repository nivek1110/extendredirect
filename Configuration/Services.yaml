services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Nivek1110\Extendredirect\:
    resource: '../Classes/*'

  Nivek1110\Extendredirect\Controller\ManagementController:
    tags: [ 'backend.controller' ]

  Nivek1110\Extendredirect\Command\CheckCommand:
    tags:
      - name: 'console.command'
        command: 'extendredirect:checkredirects'
        description: 'Check all redirects and disable broken ones'
        schedulable: true

  Nivek1110\Extendredirect\Command\CleanupLogCommand:
    tags:
      - name: 'console.command'
        command: 'extendredirect:cleanuplog'
        description: 'Delete disable log entries older than a given number of days'
        schedulable: true

  Nivek1110\Extendredirect\EventListener\AddFilterEventListener:
    tags:
      - name: event.listener
        identifier: 'extendredirect/add-filter-event-listener'
